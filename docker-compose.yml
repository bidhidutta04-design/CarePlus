services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/careplus
      # No default: compose refuses to start without real secrets, so a deploy
      # can never sign tokens with a publicly known key. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET and JWT_ACCESS_SECRET before deploying}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_SECRET and JWT_ACCESS_SECRET before deploying}
      JWT_EXPIRES_IN: 30m
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      mongo:
        condition: service_healthy
    command: sh -c "node backend/dist/index.js"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Optional: seed on first boot
  # Run: docker compose run --rm api npm run seed -w @careplus/backend

volumes:
  mongo_data:
