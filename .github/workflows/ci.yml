name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/careplus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint backend
        run: npm run lint -w @careplus/backend

      - name: Lint frontend
        run: npm run lint -w @careplus/frontend

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npm run test -w @careplus/backend

      - name: Build
        run: npm run build

      - name: Contract check
        run: |
          npm run build -w @careplus/backend
          node backend/dist/index.js > /tmp/api.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/v1/openapi.json -o /tmp/live.json && break
            sleep 2
          done
          test -f /tmp/live.json || (echo "::error::API did not start — see /tmp/api.log" && cat /tmp/api.log && kill $API_PID && exit 1)
          # Canonicalize both sides (key order + whitespace + BOM) so only real
          # contract changes fail the gate, never formatting differences.
          node -e "const fs=require('fs');for(const f of ['/tmp/live.json','docs/openapi.snapshot.json']){fs.writeFileSync(f+'.canon',JSON.stringify(JSON.parse(fs.readFileSync(f,'utf8')))+'\n')}"
          diff -u docs/openapi.snapshot.json.canon /tmp/live.json.canon || (echo "::error::OpenAPI contract changed — regenerate the snapshot against a running API and commit" && kill $API_PID && exit 1)
          kill $API_PID || true
