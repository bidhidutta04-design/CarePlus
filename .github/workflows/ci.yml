name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint backend
        run: npm run lint -w @careplus/backend

      - name: Lint frontend
        run: npm run lint -w @careplus/frontend

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npm run test -w @careplus/backend

      - name: Build
        run: npm run build

      - name: Contract check
        run: |
          npm run build -w @careplus/backend
          node backend/dist/index.js &
          sleep 5
          curl -s http://localhost:4000/api/openapi.json > /tmp/live.json
          diff -u docs/openapi.snapshot.json /tmp/live.json || (echo "::error::OpenAPI snapshot out of date — run: curl -s http://localhost:4000/api/openapi.json > docs/openapi.snapshot.json and commit" && exit 1)
          kill %1 || true
